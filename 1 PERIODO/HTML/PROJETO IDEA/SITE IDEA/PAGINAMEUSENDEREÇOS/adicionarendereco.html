    <main>
        <form action="">
            <div id="divnome">
                <label class="label" for="nome">Destinatário:</label>
                <input class="input" type="text" id="nome" required>
            </div>

            <div id="divnumber">
                <label class="label" for="telefone">Telefone:</label>
                <input class="input" type="number" id="telefone" required>
            </div>

            <div id="divendereco">
                <label class="label" for="endereco">Endereço:</label>
                <input class="input" type="text" id="endereco" required>
            </div>

            <div id="divcidade">
                <label class="label" for="cidade">Cidade:</label>
                <input class="input" type="text" id="cidade" required>
            </div>

            <div id="divestado">
                <label for="estado">UF:</label>
                <select id="estado" class="input" name="estado" required>
                    <option value="">Selecione</option>
                    <option value="RN">Rio Grande do Norte</option>
                </select>
            </div>

            <div id="divcep">
                <label class="label" for="pais">CEP:</label>
                <input class="input" type="text" id="pais" required>
            </div>

            <div id="divpais">
                <label class="label" for="pais">País:</label>
                <input class="input" type="text" id="pais" required>
            </div>

            <div id="botaosalvar">
                <button>SALVAR</button>
            </div>

        </form>
    </main>
