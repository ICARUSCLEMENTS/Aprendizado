<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">
    <title>Barbosa Hospedagens - Contato</title>
</head>

<body>
    <header>
        <h1>Barbosa</h1>
        <div class="flex vertical-center">
            <nav>
                <ul>
                    <li><a href="index.html">Fotos</a></li>
                    <li><a href="">Comodidades</a></li>
                    <li><a href="">Sobre</a></li>
                    <li><a href="contato.html">Contato</a></li>
                    <li><a href="reservarquarto.html">Reservar quarto</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main>

        <form action="" method="" id="contato">
            <h1>Formlário de Cadastro</h1>

            <label for="nome">Nome:</label>
            <input type="text" id="name" class="input" name="name" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" class="input" name="email" required>

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" class="input" name="telefone" required>

            <label for="mensagem">Mensagem:</label>
            <textarea name="mensagem" id="mensagem" cols="40" rows="10"></textarea>
            <div id="buttons">
                <button type="button" id="azul">Enviar</button>
                <button type="button" id="vermelho">Cancelar</button>
            </div>
        </form>

    </main>



</body>

</html>
